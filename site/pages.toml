MS-DOS Kermit is Columbia University's terminal and file-transfer program, developed from 1982 to 1997. Its source was released under the BSD 3-Clause licence in 2011. This page runs version 3.15, translated from 8086 code to C and WebAssembly.

Press Play and Kermit dials the notanemulator BBS. A virtual Hayes modem answers ATDT555-1992 with CONNECT 14400 and carries the session at about 14400 bits per second. Kermit's own script sets its ANSI terminal with PC colours and the original character set. Ctrl-] then C returns to Kermit's prompt. HANGUP, then EXIT, returns to Volkov Commander.
