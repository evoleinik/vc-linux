[program.en]
title = "Play Rogue online: the original 1980 roguelike"
description = "Play Rogue 5.4.4, the game that named the roguelike genre, in your browser. Built from its original C source for DOS, then translated to WebAssembly."
h1 = "Rogue"
body = """
Rogue is the dungeon game that gave the roguelike genre its name. Michael Toy and Glenn Wichman wrote it in 1980, and Ken Arnold joined them to develop it further. You go down through randomly generated dungeon levels to find the Amulet of Yendor and bring it back up.

This is Rogue 5.4.4, the last version of the original code, under the BSD 3-Clause licence. Its unedited C source is compiled for DOS with OpenWatcom and PDCurses, and the resulting DOS program is translated to C and WebAssembly. Small DOS shims stand in for Unix calls, and the vendored sources are never edited.

Move with h, j, k and l or the arrow keys, and press ? for help. S, then y, saves your game, and running rogue again restores it. Q, then y, quits.
"""

[program.ru]
title = "Играть в Rogue онлайн: оригинальный рогалик 1980 года"
description = "Играйте в браузере в Rogue 5.4.4, давшую название жанру рогалик. Собрана из оригинальных исходников на C для DOS, транслирована в WebAssembly."
h1 = "Rogue"
body = """
Rogue — это игра про подземелья, давшая название жанру рогалик. Michael Toy и Glenn Wichman написали ее в 1980 году, а позже к ним присоединился Ken Arnold для дальнейшей разработки. Вы спускаетесь по случайно сгенерированным уровням подземелья, чтобы найти Амулет Йендора и вынести его на поверхность.

Здесь представлена Rogue 5.4.4 — последняя версия оригинального кода под лицензией BSD 3-Clause. Ее неизмененный исходный код на C скомпилирован для DOS с помощью OpenWatcom и PDCurses, а полученная DOS-программа транслирована в C и WebAssembly. Небольшие прослойки DOS заменяют вызовы Unix, а сторонние исходные тексты никогда не редактируются.

Двигайтесь с помощью h, j, k и l или клавиш со стрелками, а для справки нажмите ?. Нажатие S, а затем y сохраняет игру, а повторный запуск rogue ее восстанавливает. Нажатие Q, а затем y — выход.
"""

