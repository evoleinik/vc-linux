name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # the release job uploads the binary

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: make
      - run: make test

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.2
      - run: make web
      - run: make test-web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  # The browser build, served by GitHub Pages
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: make build/vc-static
      - name: Smoke test the release binary
        run: |
          set -euo pipefail
          file build/vc-static | grep -q 'statically linked'
          # no terminal: it must refuse with exit 2, which proves it starts at all
          set +e; build/vc-static </dev/null >/dev/null 2>err.txt; code=$?; set -e
          test "$code" = 2 && grep -q 'needs a terminal' err.txt
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/vc-static vc-linux-x86_64
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" vc-linux-x86_64 --clobber
