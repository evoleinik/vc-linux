# The text of notanemulator.com's static pages, one entry per program plus the hub.
# tools/site_pages.py renders this into build/web. English is written here; the Russian
# ([*.ru]) is translated by Gemini (gemini-3.1-pro-preview), never by hand or by Claude/Codex.
#
# Body text is paragraphs separated by blank lines. The only markup is [text](url).
# `run` is typed on VC's command line, one line at a time, when someone presses Play.
# An empty `run` means Play opens VC itself.

site = "https://notanemulator.com"
repo = "https://github.com/evoleinik/vc-linux"
doi = "https://doi.org/10.5281/zenodo.23085585"

# Interface labels on every page.
[labels.en]
play = "Play"
source = "Source and licence"

[labels.ru]
play = "Запустить"
source = "Исходный код и лицензия"

[hub.en]
path = "/programs/"
title = "DOS programs that run without an emulator | notanemulator"
description = "Volkov Commander, GW-BASIC, Rogue, Hack, MS-DOS 2.0 and more, translated from 8086 code to C and WebAssembly. Play them in your browser."
h1 = "DOS programs, translated instead of emulated"
body = """
notanemulator.com runs original DOS programs in your browser, but not inside an emulator. Each program's 8086 machine code was translated to C once, instruction by instruction. That C was then compiled to WebAssembly for the browser, and to a native program for Linux. When you press a key, compiled code runs, the same as in any other program.

Every program here is kept as three things side by side. The first is its original source, unedited. The second is a reproducible build of that source, made the way it was originally built. The third is the machine translation to C. Every distinct instruction in each program is checked against the unicorn CPU emulator from random starting states, and the translated C is never edited by hand. Only DOS and the PC hardware around the CPU are rewritten by hand.

Volkov Commander 4.99 starts first. The other programs live on its H: drive. Files you create live in memory and vanish when you reload the page.

The source, the build and the translator are on [GitHub](https://github.com/evoleinik/vc-linux). Each release is archived on [Zenodo](https://doi.org/10.5281/zenodo.23085585).
"""

[hub.ru]
path = "/ru/"
title = "Программы DOS, работающие без эмулятора | notanemulator"
description = "Volkov Commander, GW-BASIC, Rogue, Hack, MS-DOS 2.0 и другие программы, транслированные из 8086-кода в C и WebAssembly. Играйте в браузере."
h1 = "DOS-программы: трансляция вместо эмуляции"
body = """
notanemulator.com запускает оригинальные программы для DOS в браузере, но не в эмуляторе. Машинный код 8086 каждой программы был однократно транслирован в C, инструкция за инструкцией. Этот C-код затем скомпилировали в WebAssembly для браузера и в нативное приложение для Linux. Когда вы нажимаете клавишу, выполняется скомпилированный код, как в любой другой программе.

Каждая программа хранится здесь в виде трех составляющих. Первая — ее оригинальный исходный код без изменений. Вторая — воспроизводимая сборка этого кода, сделанная так же, как в оригинале. Третья — машинный перевод в C. Каждая уникальная инструкция в каждой программе проверяется на эмуляторе процессора unicorn из случайных начальных состояний, а транслированный C-код никогда не правится вручную. Только DOS и аппаратная часть ПК вокруг процессора переписаны вручную.

Первым запускается Volkov Commander 4.99. Остальные программы находятся на его диске H:. Созданные вами файлы живут в памяти и исчезают при перезагрузке страницы.

Исходный код, сборка и транслятор находятся на [GitHub](https://github.com/evoleinik/vc-linux). Каждый релиз архивируется на [Zenodo](https://doi.org/10.5281/zenodo.23085585).
"""

