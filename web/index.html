<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Volkov Commander, translated from 8086 assembly to WebAssembly. Not an emulator.">
  <title>Volkov Commander: not an emulator</title>
  <link rel="preload" href="./vendor/WebPlus_IBM_VGA_8x16.woff" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="./vc.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="modulepreload" href="./vc.mjs">
  <link rel="stylesheet" href="./vendor/xterm.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230000aa'/%3E%3Ctext x='8' y='12' font-family='monospace' font-size='9' font-weight='bold' fill='%2355ffff' text-anchor='middle'%3EVC%3C/text%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: "IBM VGA";
      src: url("./vendor/WebPlus_IBM_VGA_8x16.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    body { color: #999; font: 12px/1.45 system-ui, sans-serif; }
    main {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #terminal { flex: none; }
    #terminal .xterm-viewport { overflow-y: hidden; }
    footer { flex: none; max-width: 100%; text-align: center; }
    p { margin: 0; }
    a { color: #aaa; text-decoration-color: #666; }
    a:hover, a:focus-visible { color: #fff; }
    .font-credit { margin-top: 4px; font-size: 10px; color: #777; }
    #exit-message { margin-bottom: 8px; color: #ddd; }
  </style>
</head>
<body>
  <main>
    <div id="terminal" role="application" aria-label="Volkov Commander, 80 columns by 25 rows"></div>
    <footer>
      <p id="exit-message" role="status" hidden></p>
      <p>Volkov Commander 4.99, machine-translated from 8086 assembly to WebAssembly. Not an emulator. Files live in memory and vanish on reload. <a href="https://github.com/evoleinik/vc-linux">Linux version on GitHub.</a></p>
      <p class="font-credit">IBM VGA font: <a href="https://int10h.org/oldschool-pc-fonts/">VileR, int10h.org</a> · <a href="./vendor/LICENSE-font.txt">CC BY-SA 4.0</a></p>
    </footer>
  </main>
  <script type="module" src="./vc-web.js"></script>
</body>
</html>
