[program.en]
title = "GW-BASIC online: Microsoft's 1983 BASIC in your browser"
description = "Run Microsoft GW-BASIC from 1983 in your browser, with twelve classic BASIC Computer Games and CGA graphics. Translated from 8086 code, not emulated."
h1 = "GW-BASIC"
body = """
GW-BASIC is the BASIC interpreter Microsoft shipped with MS-DOS from 1983. Microsoft released its 8086 assembly source under the MIT licence in 2020. TK Chia's fork adds the OEM modules that release left out. This page runs that fork, assembled with JWasm and then translated to C and WebAssembly.

Twelve games from David H. Ahl's 1978 book BASIC Computer Games are on the H: drive, in the GAMES directory: Acey Ducey, Amazing, Animal, Bagels, Blackjack, Hamurabi, Hangman, Hurkle, Life, Lunar LEM, Super Star Trek and Tic-Tac-Toe. In Volkov Commander, select a .BAS file and press Enter to run it. Type SYSTEM to return to Volkov Commander.

CGA graphics work. SCREEN 1, PSET, LINE, CIRCLE and DRAW draw on a real 320x200 four-colour screen, and the browser shows the exact pixels. The original interpreter has only 31 bytes of typeahead, so type long lines rather than pasting them.
"""

[program.ru]
title = "GW-BASIC онлайн: BASIC 1983 года от Microsoft в браузере"
description = "Работайте в Microsoft GW-BASIC 1983 года прямо в браузере. Графика CGA и 12 игр из BASIC Computer Games. Транслировано из кода 8086, не эмуляция."
h1 = "GW-BASIC"
body = """
GW-BASIC — интерпретатор языка BASIC, который Microsoft поставляла вместе с MS-DOS начиная с 1983 года. В 2020 году Microsoft открыла его исходный код на ассемблере 8086 под лицензией MIT. Форк TK Chia добавляет модули OEM, не вошедшие в этот релиз. На этой странице работает именно этот форк, собранный с помощью JWasm, а затем транслированный в C и WebAssembly.

Двенадцать игр из книги BASIC Computer Games, изданной David H. Ahl в 1978 году, находятся на диске H:, в каталоге GAMES: Acey Ducey, Amazing, Animal, Bagels, Blackjack, Hamurabi, Hangman, Hurkle, Life, Lunar LEM, Super Star Trek и Tic-Tac-Toe. В Volkov Commander выберите файл .BAS и нажмите Enter, чтобы его запустить. Введите SYSTEM для возврата в Volkov Commander.

Графика CGA работает. Команды SCREEN 1, PSET, LINE, CIRCLE и DRAW рисуют на настоящем четырехцветном экране 320x200, а браузер показывает в точности те же пиксели. В оригинальном интерпретаторе буфер опережающего ввода составляет всего 31 байт, поэтому длинные строки лучше печатать, а не вставлять целиком.
"""

