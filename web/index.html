<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Volkov Commander, translated from 8086 assembly to WebAssembly. Not an emulator.">
  <title>Volkov Commander: not an emulator</title>
  <link rel="preload" href="./vendor/WebPlus_IBM_VGA_8x16.woff?v=__V__" as="font" type="font/woff" crossorigin>
  <link rel="preload" href="./vc.wasm?v=__V__" as="fetch" type="application/wasm" crossorigin>
  <link rel="modulepreload" href="./vc.mjs?v=__V__">
  <link rel="stylesheet" href="./vendor/xterm.css?v=__V__">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230000aa'/%3E%3Ctext x='8' y='12' font-family='monospace' font-size='9' font-weight='bold' fill='%2355ffff' text-anchor='middle'%3EVC%3C/text%3E%3C/svg%3E">
  <style>
    @font-face {
      font-family: "IBM VGA";
      src: url("./vendor/WebPlus_IBM_VGA_8x16.woff?v=__V__") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    body { color: #999; font: 12px/1.45 system-ui, sans-serif; }
    main {
      position: relative;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    #terminal { flex: none; position: relative; }
    #source-panel {
      position: absolute;
      box-sizing: border-box;
      overflow: auto;
      overscroll-behavior: contain;
      border: 2px solid #55ffff;
      padding: 8px;
      background: #0000aa;
      color: #aaaaaa;
      font: 16px/1 "IBM VGA", monospace;
      tab-size: 8;
      text-align: left;
    }
    #source-panel h2 { margin: 10px 0 6px; color: #ffff55; font: inherit; }
    #source-panel h2:first-child { margin-top: 0; }
    #source-panel pre { margin: 0; font: inherit; white-space: pre; min-width: max-content; }
    #source-panel .source-current { background: #00aaaa; color: #000; }
    #source-panel .source-note { color: #55ffff; margin-bottom: 6px; }
    #source-button {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 1;
      border: 1px solid #55ffff;
      padding: 2px 8px;
      background: #0000aa;
      color: #55ffff;
      font: 16px/1 "IBM VGA", monospace;
      cursor: pointer;
    }
    #source-button:focus-visible { outline: 2px solid #ffff55; outline-offset: 2px; }
    #source-button:disabled { opacity: 0.5; cursor: default; }
    #terminal .xterm-viewport { overflow-y: hidden; }
    /* Keep xterm laid out and focusable: its textarea and key translator
       still receive input while the pixels cover its invisible screen. */
    #terminal.graphics-mode .xterm { opacity: 0; }
    #graphics {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      pointer-events: none;
    }
    #keypad {
      display: none;
      flex: none;
      width: min(100%, 640px);
      grid-template-columns: repeat(5, minmax(0, 1fr));
      grid-template-rows: repeat(5, minmax(44px, auto));
      gap: 6px;
      touch-action: manipulation;
    }
    @media (pointer: coarse) {
      html, body {
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    }
    #keypad button {
      min-height: 44px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      border: 1px solid #555;
      border-radius: 4px;
      background: #161616;
      color: #ddd;
      font: 14px/1.2 system-ui, sans-serif;
    }
    #keypad button:active { background: #333; }
    #keypad .escape { background: #5a1616; border-color: #e24b4a; color: #ffd6d6; }
    #keypad .tab { background: #4a3306; border-color: #ba7517; color: #ffe2b0; }
    #keypad .enter {
      grid-column: 5;
      grid-row: 3 / span 2;
      background: #173d0a;
      border-color: #639922;
      color: #d8f0b8;
    }
    #keypad .modifier { border-color: #7f77dd; color: #cecbf6; }
    #keypad .modifier[aria-pressed="true"] { background: #534AB7; color: #fff; }
    #keypad .keyboard { grid-column: span 3; }
    @media (pointer: coarse) and (orientation: portrait) {
      html, body { overflow: hidden; }
      main {
        position: fixed;
        left: 0;
        top: var(--vc-viewport-top, 0px);
        height: var(--vc-viewport-height, 100%);
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
        justify-content: flex-start;
        gap: 0;
        overflow: hidden;
      }
      #terminal { overflow: hidden; }
      #terminal .xterm { transform-origin: top left; }
      #keypad {
        position: absolute;
        left: env(safe-area-inset-left);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        width: auto;
      }
      #keypad:not([hidden]) { display: grid; }
      #keypad[data-keyboard-open="true"] { display: none; }
      #source-button { position: static; box-sizing: border-box; min-height: 44px; margin-top: 6px; }
      /* Prevent iOS's text-field focus zoom without resizing the screen. */
      #terminal .xterm-helper-textarea { font-size: 16px !important; }
    }
    footer { flex: none; max-width: 100%; text-align: center; }
    p { margin: 0; }
    a { color: #aaa; text-decoration-color: #666; }
    a:hover, a:focus-visible { color: #fff; }
    .font-credit { margin-top: 4px; font-size: 10px; color: #777; }
    #exit-message { margin-bottom: 8px; color: #ddd; }
  </style>
</head>
<body>
  <main>
    <div id="terminal" role="application" aria-label="Volkov Commander, 80 columns by 25 rows"></div>
    <div id="keypad" role="group" aria-label="Touch keyboard" hidden>
      <button type="button" data-key="F1">F1</button>
      <button type="button" data-key="F2">F2</button>
      <button type="button" data-key="F3">F3</button>
      <button type="button" data-key="F4">F4</button>
      <button type="button" data-key="F5">F5</button>
      <button type="button" data-key="F6">F6</button>
      <button type="button" data-key="F7">F7</button>
      <button type="button" data-key="F8">F8</button>
      <button type="button" data-key="F9">F9</button>
      <button type="button" data-key="F10">F10</button>
      <button type="button" data-key="Escape" class="escape">Esc</button>
      <button type="button" data-key="Tab" class="tab">Tab</button>
      <button type="button" data-key="ArrowUp" aria-label="Up">↑</button>
      <button type="button" data-key="Insert">Ins</button>
      <button type="button" data-key="Enter" class="enter">Enter</button>
      <button type="button" data-key="Control" class="modifier" aria-pressed="false">Ctrl</button>
      <button type="button" data-key="ArrowLeft" aria-label="Left">←</button>
      <button type="button" data-key="ArrowDown" aria-label="Down">↓</button>
      <button type="button" data-key="ArrowRight" aria-label="Right">→</button>
      <button type="button" data-key="Shift" class="modifier" aria-pressed="false">Shift</button>
      <button type="button" data-key="Alt" class="modifier" aria-pressed="false">Alt</button>
      <button id="keyboard-button" type="button" data-key="Keyboard" class="keyboard">Keyboard</button>
    </div>
    <aside id="source-panel" aria-label="Original source" hidden></aside>
    <footer>
      <p id="exit-message" role="status" hidden></p>
      <p><span id="page-description">Volkov Commander 4.99, machine-translated from 8086 assembly to WebAssembly. Not an emulator. Files live in memory and vanish on reload. </span><a id="linux-version" href="https://github.com/evoleinik/vc-linux">Linux version on GitHub.</a></p>
      <p class="font-credit"><span id="font-credit-label">IBM VGA font: </span><a href="https://int10h.org/oldschool-pc-fonts/">VileR, int10h.org</a> · <a href="./vendor/LICENSE-font.txt?v=__V__">CC BY-SA 4.0</a></p>
    </footer>
  </main>
  <button id="source-button" type="button" aria-controls="source-panel" aria-expanded="false" title="Show original source (Ctrl-Shift-F12)" disabled>Source</button>
  <script type="module" src="./vc-web.js?v=__V__"></script>
</body>
</html>
