[program.en]
title = "Volkov Commander 4.99 and 4.05: the DOS file manager"
description = "Run Volkov Commander 4.99 and 4.05 in your browser, translated from the original 8086 assembly to WebAssembly. No emulator, no download."
h1 = "Volkov Commander"
body = """
Volkov Commander is a two-panel DOS file manager in the style of Norton Commander. Vsevolod Volkov wrote it in 8086 assembly between 1991 and 2000, and it was one of the most widely used DOS file managers in Russia and the other former Soviet countries. In 2026 he released its source under the BSD 2-Clause licence. Danila Sukharev had already preserved that source and made it build with the open JWasm assembler.

This page runs Volkov Commander 4.99.09, the last version, translated from its own assembly into C and compiled to WebAssembly. F3 views a file, F4 edits it in VZ Editor, F5 copies, F6 moves, F7 makes a directory and F8 deletes. Alt-F10 shows the directory tree. On a phone, an on-screen keyboard gives you the F-keys.

Volkov Commander 4.05 is here too, on the H: drive. JWasm builds it byte for byte identical to the original build made with Borland's TASM.

On Linux, the same translated code is a native program that manages your real files, including long and Cyrillic names. It is one static binary, on the [releases page](https://github.com/evoleinik/vc-linux/releases/latest).
"""

[program.ru]
title = "Волков Коммандер (Volkov Commander) онлайн в браузере"
description = "Запускайте Volkov Commander 4.99 и 4.05 в браузере. Оригинальный код на ассемблере 8086 транслирован в WebAssembly. Без эмуляторов и загрузок."
h1 = "Volkov Commander"
body = """
Volkov Commander — двухпанельный файловый менеджер для DOS в стиле Norton Commander. Всеволод Волков писал его на ассемблере 8086 с 1991 по 2000 год, и это был один из самых популярных файловых менеджеров DOS в России и других странах бывшего СССР. В 2026 году он открыл исходный код под лицензией BSD 2-Clause. Данила Сухарев до этого сохранил эти исходники и заставил их собираться открытым ассемблером JWasm.

На этой странице работает Volkov Commander 4.99.09, последняя версия, транслированная из своего ассемблерного кода в C и скомпилированная в WebAssembly. F3 показывает файл, F4 открывает его в VZ Editor, F5 копирует, F6 перемещает, F7 создает каталог, а F8 удаляет. Alt-F10 показывает дерево каталогов. На телефоне F-клавиши доступны на экранной клавиатуре.

Volkov Commander 4.05 тоже здесь, на диске H:. JWasm собирает его байт в байт идентично оригинальной сборке, сделанной с помощью TASM от Borland.

В Linux этот же транслированный код работает как нативная программа для управления вашими реальными файлами, включая длинные имена и кириллицу. Это один статический бинарник на [странице релизов](https://github.com/evoleinik/vc-linux/releases/latest).
"""

